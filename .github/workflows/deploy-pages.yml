+PR: Fix Pages deployment workflow and make web-ui clipboard copy robust
+
+What I changed
+
+- Replaced .github/workflows/deploy-pages.yml to use the official Pages actions (configure-pages, upload-pages-artifact, deploy-pages) and set job permissions (contents: read, pages: write, id-token: write). This avoids the need for a Personal Access Token (PAT) and uses the runner-provided GITHUB_TOKEN with pages permission.
+
+- Patched web-ui/index.htm to fix clipboard handling:
+  - Properly handle navigator.clipboard Promises with .catch()
+  - Avoid calling .then() on undefined when clipboard API is missing
+  - Add a textarea/execCommand fallback for older browsers or insecure contexts
+
+Why
+
+- The repo previously used peaceiris/actions-gh-pages with a PAT; switching to the official actions simplifies permissions and is aligned with GitHub recommendations.
+- The index.htm code could trigger unhandled promise rejections or TypeErrors in some environments; the fix makes the UI more robust across browsers.
+
+Notes for deploy / DNS
+
+- The published site includes web-ui/CNAME (noelcreates.dev). You must ensure DNS is configured for that domain before GitHub Pages will serve it. Steps:
+  1. Add apex A records for noelcreates.dev pointing to GitHub Pages IPs:
+     - 185.199.108.153
+     - 185.199.109.153
+     - 185.199.110.153
+     - 185.199.111.153
+  2. (Optional) Add a CNAME for www → noelandrewharron1983-droid.github.io
+  3. If you use Cloudflare or other proxying, set records to DNS-only (disable proxying) while GitHub validates the domain and issues TLS.
+  4. In repo Settings → Pages, confirm the custom domain is set to noelcreates.dev and enable "Enforce HTTPS" after certificate issuance.
+
+Follow-up
+
+- After DNS updates, trigger a push to main or re-run the Pages workflow to publish. Check Actions logs for errors and Pages settings for the served domain.
+
