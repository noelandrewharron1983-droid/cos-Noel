From: Copilot <copilot@users.noreply.github.com>
Date: Thu, 29 Jul 2026 00:00:00 +0000
Subject: [PATCH] fix: pages deploy workflow + index.htm clipboard fallback

Replaces peaceiris Pages workflow with the official GitHub Pages actions (configure-pages,
upload-pages-artifact, deploy-pages) and tightens job permissions. Also fixes clipboard
handling in web-ui/index.htm to avoid unhandled promise rejections and add a robust
fallback for older browsers. Adds PR_NOTES.md describing the changes and DNS steps.

---
 .github/workflows/deploy-pages.yml |  37 +++++++++++++++++++++++++++++++
 PR_NOTES.md                        |  98 +++++++++++++++++++++++++++++++++++++++++++++++++++
 web-ui/index.htm                   | 222 ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++-
 3 files changed, 356 insertions(+), 1 deletion(-)
 create mode 100644 PR_NOTES.md
 rewrite web-ui/index.htm (98%)
 rewrite .github/workflows/deploy-pages.yml (100%)
diff --git a/.github/workflows/deploy-pages.yml b/.github/workflows/deploy-pages.yml
new file mode 100644
index 0000000..1111111
--- /dev/null
+++ b/.github/workflows/deploy-pages.yml
@@ -0,0 +1,37 @@
+name: Deploy COS site
+on:
+  push:
+    branches: [ main ]
+
+jobs:
+  build-and-deploy:
+    runs-on: ubuntu-latest
+    permissions:
+      contents: read
+      pages: write
+      id-token: write
+
+    steps:
+      - name: Checkout
+        uses: actions/checkout@v4
+
+      - name: Configure Pages
+        uses: actions/configure-pages@v3
+
+      - name: Upload artifact
+        uses: actions/upload-pages-artifact@v1
+        with:
+          path: ./web-ui
+
+      - name: Deploy to GitHub Pages
+        uses: actions/deploy-pages@v1
+
