name: Test web-ui

on:
  push:
    branches: [main]
    paths:
      - 'web-ui/**'
      - 'prompts/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/test-web-ui.yml'
  pull_request:
    paths:
      - 'web-ui/**'
      - 'prompts/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/test-web-ui.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run unit + accessibility tests
        run: npm run test

      - name: Run e2e tests
        run: npm run test:e2e
