<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <title>Noel COS Quick Switch</title>
 <style>
 body { font-family: system-ui, -apple-system, Arial; padding: 28px; background:#0f1724; color:#e6eef8; }
 .bar { display:flex; gap:10px; align-items:center; }
 button { padding:12px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
 .deep { background:#0ea5a4; color:#012; }
 .storm { background:#7c3aed; color:#fff; }
 .reset { background:#10b981; color:#012; }
 .copy { background:#111827; color:#fff; }
 select { padding:8px 10px; border-radius:6px; border:none; background:#111827; color:#e6eef8; }
 pre { background:#0b1220; padding:12px; border-radius:8px; margin-top:16px; white-space:pre-wrap; }
 .status { margin-top:10px; min-height:20px; color:#9aa4b2; }
 .status[data-status="success"] { color:#34d399; }
 .status[data-status="error"] { color:#fca5a5; }
 </style>
</head>
<body>
 <main>
 <h1>Noel — COS Quick Switch</h1>
 <div class="bar">
 <button type="button" class="deep" data-mode="deep" aria-label="Activate Deep Work mode">🔵 Deep Work</button>
 <button type="button" class="storm" data-mode="storm" aria-label="Activate Creative Storm mode">🟣 Creative Storm</button>
 <button type="button" class="reset" data-mode="reset" aria-label="Activate Reset mode">🟢 Reset</button>
 <label for="variant" style="margin-left:8px;color:#9aa4b2">Variant:</label>
 <select id="variant" aria-label="Prompt variant">
   <option value="condensed">Condensed</option>
   <option value="full">Full</option>
   <option value="quick">Quick</option>
 </select>
 <button type="button" id="copyBtn" class="copy" aria-label="Copy prompt to clipboard">📋 Copy Prompt</button>
 </div>

 <pre id="promptArea">Activate a mode to load its condensed prompt.</pre>
 <p id="copyStatus" class="status" data-status="idle" role="status" aria-live="polite" aria-atomic="true"></p>
 <script src="../prompts/catalog.js"></script>
 <script src="./app.js"></script>
 </main>
</body>
</html>
